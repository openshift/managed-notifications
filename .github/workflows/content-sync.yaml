name: Content Sync

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cora-sync:
    if: &authorized-publication >-
      github.repository == 'openshift/managed-notifications' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: content-sync-managed-notifications
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SYNC_WRITER_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync content
        env:
          BUCKET: ${{ vars.CORA_CONTENT_BUCKET }}
        run: |
          set -euo pipefail

          aws s3 sync . "s3://${BUCKET}/managed-notifications/" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl --fail-with-body -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"managed-notifications cora-sync failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.TRUST_OBS_INT_BOT_WEBHOOK_URL }}"

  boundary-stage-sync:
    if: *authorized-publication
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: content-sync-managed-notifications-boundary-stage
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.BOUNDARY_STAGE_SYNC_WRITER_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync content
        env:
          BUCKET: ${{ vars.BOUNDARY_STAGE_CONTENT_BUCKET }}
        run: |
          set -euo pipefail

          destination="s3://${BUCKET}/managed-notifications/"
          test -d .
          test -n "$(find . -type f ! -path './.git/*' ! -path './.github/*' -print -quit)"
          aws s3 sync . "$destination" \
            --delete \
            --sse aws:kms \
            --region us-east-1 \
            --exclude ".git/*" \
            --exclude ".github/*"

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl --fail-with-body -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"managed-notifications boundary-stage-sync failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.TRUST_OBS_INT_BOT_WEBHOOK_URL }}"
